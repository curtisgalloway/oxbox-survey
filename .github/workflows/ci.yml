# surveytest covers two things: the fetcher's venue adapters against recorded
# fixtures, and the evidence rules this repo asserts in prose — a class B `free`
# is null and never false, observations carry valid frontmatter, a probe-sourced
# observation never claims a USE. A rule that lives only in a README is a hope.
#
# Entirely offline. No network, no API key, no provider, so it runs anywhere.
# 3.9 is the floor because the system python3 on macOS is still 3.9, matching
# oxbox.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  survey:
    name: survey (${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: surveytest
        run: python surveytest.py
      # The fetcher must stay importable and its CLI must parse on every
      # supported interpreter, even where no catalog is reachable.
      - name: oxsurvey --list-venues
        run: python oxsurvey --list-venues
